<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Salle de cinéma en arc réel</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    .cinema {
      position: relative;
      width: 100%;
      height: 600px;
      margin-top: 30px;
    }

    .seat {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      background: crimson;
      border-radius: 50%;
      position: absolute;
      transition: 0.3s;
      border: 2px solid #333;
    }

    .seat:hover { background: gold; cursor: pointer; }
    .seat:checked { background: limegreen; }

    .screen {
      width: 60%;
      height: 30px;
      background: silver;
      margin: 0 auto;
      border-radius: 5px;
      line-height: 30px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Disposition des sièges 🎬</h1>
  <div class="screen">ÉCRAN GÉANT</div>
  <div class="cinema" id="cinema"></div>

  <!-- Champ pour stocker les sièges sélectionnés -->
  <form action="/reserve" method="POST">
    <input type="text" name="seats" id="seatsInput" readonly required>
    <button type="submit">Valider et réserver</button>
  </form>

  <h3>Sièges sélectionnés :</h3>
  <ul id="selectedSeats"></ul>

  <script>
    const cinema = document.getElementById("cinema");
    const selectedSeatsList = document.getElementById("selectedSeats");
    const seatsInput = document.getElementById("seatsInput");
    let selectedSeats = [];

    const niveaux = 10;       // nombre de rangées
    const baseSeats = 30;    // sièges au premier niveau
    const increment = 2;     // incrément par niveau

    const centerX = window.innerWidth / 2;
    const centerY = 650;

    const arcAngle = 0.35 * 2 * Math.PI;
    const seatSpacing = 1.2;

    for (let n = 0; n < niveaux; n++) {
      const seatsCount = baseSeats + (n * increment);
      const radius = 180 + (n * 45);
      const angleStep = (arcAngle * seatSpacing) / (seatsCount - 1);
      const startAngle = Math.PI/2 - (arcAngle * seatSpacing)/2;

      for (let s = 0; s < seatsCount; s++) {
        const seat = document.createElement("input");
        seat.type = "checkbox";
        seat.classList.add("seat");
        seat.id = `seat-${String.fromCharCode(65+n)}-${s+1}`; // ex: seat-A-1

        const angle = startAngle + (s * angleStep);
        const x = centerX + radius * Math.cos(angle);
        const y = centerY - radius * Math.sin(angle);

        seat.style.left = (x - 11) + "px";
        seat.style.top = (y - 11) + "px";

        seat.addEventListener("change", () => {
          const seatId = seat.id;
          if (seat.checked) {
            selectedSeats.push(seatId);
            const li = document.createElement("li");
            li.textContent = seatId;
            li.id = "li-" + seatId;
            selectedSeatsList.appendChild(li);
          } else {
            selectedSeats = selectedSeats.filter(id => id !== seatId);
            document.getElementById("li-" + seatId)?.remove();
          }
          // ⚡ mise à jour immédiate du champ seats
          seatsInput.value = selectedSeats.join(",");
        });

        cinema.appendChild(seat);
      }
    }
  </script>
</body>
</html>
