<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Salle de cinéma en arc réel</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    .cinema {
      position: relative;
      width: 100%;
      height: 100%;
      margin-top: 30px;
    }

    /* Style des checkbox comme des sièges ronds */
    .seat {
      appearance: none;          /* supprime le style par défaut */
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      background: crimson;
      border-radius: 50%;        /* rond */
      position: absolute;
      transition: 0.3s;
      border: 2px solid #333;
    }

    .seat:hover {
      background: gold;
      cursor: pointer;
    }

    .seat:checked {
      background: limegreen;     /* couleur quand sélectionné */
    }

    .screen {
      width: 60%;
      height: 30px;
      background: silver;
      margin: 0 auto;
      border-radius: 5px;
    }

    h1 {
      margin: 15px 0;
    }
  </style>
</head>
<body>
  <h1>Disposition des sièges 🎬</h1>
  <div class="screen">ÉCRAN GÉANT</div>
  <div class="cinema" id="cinema"></div>

  <script>
    const cinema = document.getElementById("cinema");
    const niveaux = 10;       // nombre de niveaux
    const baseSeats = 30;     // sièges au premier niveau
    const increment = 2;      // incrément par niveau

    const centerX = window.innerWidth / 2; // centre horizontal
    const centerY = 550; // position de l’écran en bas

    // arc de 126° = 0.35 * 2π radians
    const arcAngle = 0.35 * 2 * Math.PI;
    const seatSpacing = 1.2; // facteur d'espacement angulaire

    for (let n = 0; n < niveaux; n++) {
      const seatsCount = baseSeats + (n * increment);
      const radius = 180 + (n * 45); // rayon plus grand pour éviter chevauchement
      const angleStep = (arcAngle * seatSpacing) / (seatsCount - 1);
      const startAngle = Math.PI/2 - (arcAngle * seatSpacing)/2; // centré sur l’écran

      for (let s = 0; s < seatsCount; s++) {
        const seat = document.createElement("input");
        seat.type = "checkbox";
        seat.classList.add("seat");

        const angle = startAngle + (s * angleStep);
        const x = centerX + radius * Math.cos(angle);
        const y = centerY - radius * Math.sin(angle);

        seat.style.left = (x - 11) + "px"; // ajusté pour centrage
        seat.style.top = (y - 11) + "px";

        cinema.appendChild(seat);
      }
    }
  </script>
</body>
</html>
